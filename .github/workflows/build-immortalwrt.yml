name: Build ImmortalWrt MT798X

run-name: ${{ github.event.inputs.device || 'all' }} · ${{ github.event.inputs.branch || 'openwrt-24.10-6.6' }}

# =========================================================
#   padavanonly/immortalwrt-mt798x-6.6
#
#   device : all / x60 / x60-pro
#
#   · device=all 时展开成 2 个并行 job，一个机型一个 job，
#     各自下载源码、各自编译、各自产出 Artifact 和 Release，互不覆盖。
#   · 机型配置只有一份 configs/<机型>.config（diffconfig），
#     用源码自带的 defconfig/mt7986-ax6000.config 打底。
#   · 只用源码自带 feeds 里的包，不添加任何第三方 feed/插件。
# =========================================================

env:
  BUILD_ROOT: /workdir

  DEVICE_INPUT: ${{ github.event.inputs.device || github.event.client_payload.device || 'all' }}
  REPO_BRANCH: ${{ github.event.inputs.branch || github.event.client_payload.branch || 'openwrt-24.10-6.6' }}
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git

  UPLOAD_RELEASE: ${{ github.event.inputs.upload_release || 'true' }}
  TZ: Asia/Shanghai

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      device:
        description: '机型（all = 两个机型并行全编）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x60
          - x60-pro

      branch:
        description: '源码分支'
        required: false
        default: 'openwrt-24.10-6.6'

      upload_release:
        description: '发布到 Release（false 则只上传 Artifact）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      ssh:
        description: '开启 SSH 调试（仅仓库所有者，会阻塞构建）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  # =========================================================
  # 0. 把 device 下拉框展开成矩阵
  #    job 级 if 也能做，但会让三个 runner 都先启动再跳过；
  #    单独一个几秒的 prepare job 更省额度，逻辑也更直观。
  # =========================================================
  prepare:
    name: Resolve matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build device matrix
        id: matrix
        env:
          DEVICE: ${{ env.DEVICE_INPUT }}
        run: |
          case "$DEVICE" in
            all)
              MATRIX='{"include":[
                {"device":"x60","profile":"ruijie_rg-x60-new-expand"},
                {"device":"x60-pro","profile":"ruijie_rg-x60-pro-107m"}
              ]}'
              ;;
            x60)
              MATRIX='{"include":[{"device":"x60","profile":"ruijie_rg-x60-new-expand"}]}'
              ;;
            x60-pro)
              MATRIX='{"include":[{"device":"x60-pro","profile":"ruijie_rg-x60-pro-107m"}]}'
              ;;
            *)
              echo "::error::未知机型: ${DEVICE}（可选 all / x60 / x60-pro）"
              exit 1
              ;;
          esac
          # fromJSON 不接受换行，这里压成一行
          MATRIX=$(printf '%s' "$MATRIX" | tr -d '\n ')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "本次编译矩阵: ${MATRIX}"

      # 在启动 2 个构建 runner 之前先确认配置文件都在，避免白跑
      - name: Verify config files
        env:
          DEVICE: ${{ env.DEVICE_INPUT }}
        run: |
          case "$DEVICE" in
            all) DEVICES="x60 x60-pro" ;;
            *)   DEVICES="$DEVICE" ;;
          esac

          MISSING=0
          for d in $DEVICES; do
            f="configs/${d}.config"
            if [ -f "$f" ]; then
              echo "✅ ${f}"
            else
              echo "::error::缺少配置文件 ${f}"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

  # =========================================================
  # 1. 每个机型一个独立 job
  # =========================================================
  build:
    name: Build ${{ matrix.device }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # 同一机型不要并发跑两份（会互抢 Release 的同名资产）
    concurrency:
      group: mt798x-${{ github.ref }}-${{ matrix.device }}
      cancel-in-progress: false
    env:
      DEVICE: ${{ matrix.device }}
      PROFILE: ${{ matrix.profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ---------------------------------------------------
      # 释放空间 + 编译依赖
      #   runner 自带约 14G 可用，MT7986 全量编译不够，
      #   先删掉 dotnet/android/ghc 等预装大件，再加 8G swap。
      # ---------------------------------------------------
      - name: Free disk space & install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          sudo -E apt-get -yqq update
          # 这些包在 ubuntu-24.04 上都存在，装不上就直接失败，不掩盖问题
          sudo -E apt-get -yqq install \
            build-essential clang llvm libssl-dev libelf-dev bc flex bison \
            python3 python3-setuptools python3-pyelftools python3-dev \
            xz-utils tar unzip zip zstd dos2unix ccache gettext rsync file \
            wget curl git subversion swig libncurses-dev \
            device-tree-compiler qemu-utils squashfs-tools gawk patch bzip2 \
            autoconf automake libtool pkg-config libpython3-dev dwarves

          # ImmortalWrt 官方依赖脚本；个别包在 24.04 上改名时由它补齐。
          # 失败只警告：上面已装好编译必需的最小集合。
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' \
            || echo "::warning::init_build_environment.sh 执行失败，继续使用已装依赖"

          sudo -E apt-get -yqq autoremove --purge || true
          sudo -E apt-get -yqq clean || true
          sudo timedatectl set-timezone "$TZ"

          sudo mkdir -p "$BUILD_ROOT"
          sudo chown "$USER":"$USER" "$BUILD_ROOT"
          df -hT
          free -h

      # ---------------------------------------------------
      # 克隆源码
      #   只拉目标分支、深度 1：构建不需要完整历史。
      # ---------------------------------------------------
      - name: Clone source
        run: |
          cd "$BUILD_ROOT"
          rm -rf openwrt
          for i in 1 2 3; do
            echo "===== git clone 第 $i 次 ====="
            if git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt; then
              break
            fi
            rm -rf openwrt
            sleep 5
          done
          if [ ! -d openwrt/.git ]; then
            echo "::error::源码克隆失败: ${REPO_URL} (${REPO_BRANCH})"
            exit 1
          fi
          ln -sf "$BUILD_ROOT/openwrt" "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          # actions/cache 的 path 必须存在，否则恢复会被跳过
          mkdir -p dl
          echo "commit: $(git rev-parse --short HEAD)"
          df -hT "$PWD"

      # ---------------------------------------------------
      # 解析本次构建参数
      # ---------------------------------------------------
      - name: Resolve build metadata
        id: meta
        run: |
          CONFIG_FILE="configs/${DEVICE}.config"
          if [ ! -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            echo "::error::机型配置不存在: ${CONFIG_FILE}"
            echo "::error::请确认机型(${DEVICE})"
            exit 1
          fi
          echo "CONFIG_FILE=${CONFIG_FILE}" >> "$GITHUB_ENV"
          echo "week=$(date +%Y%W)" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "机型    : ${DEVICE} (${PROFILE})"
          echo "仓库    : ${REPO_URL}"
          echo "分支    : ${REPO_BRANCH}"
          echo "配置    : ${CONFIG_FILE}"
          echo "========================================"

      # ---------------------------------------------------
      # dl 缓存：按「分支 + 周」滚动
      #   同一周的多次构建复用同一份；all 的 2 个 job 共享。
      #   只缓存下载包，不缓存 toolchain —— 两个机型配置不同，
      #   混用 toolchain 缓存收益小、踩坑成本高。
      # ---------------------------------------------------
      - name: Restore dl cache
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BUILD_ROOT }}/openwrt/dl
          key: mt798x-dl-${{ env.REPO_BRANCH }}-${{ steps.meta.outputs.week }}
          restore-keys: |
            mt798x-dl-${{ env.REPO_BRANCH }}-

      # ---------------------------------------------------
      # diy-part1：feeds update 之前的钩子（默认留空）
      # ---------------------------------------------------
      - name: Run diy-part1.sh
        run: |
          cd "$BUILD_ROOT/openwrt"
          P1="$GITHUB_WORKSPACE/diy-part1.sh"
          if [ -f "$P1" ]; then
            echo "执行: ${P1}"
            dos2unix "$P1" 2>/dev/null || true
            bash "$P1"
          else
            echo "::warning::未找到 diy-part1.sh，跳过"
          fi

      # ---------------------------------------------------
      # feeds：只用源码自带的四个 feed，不添加第三方源
      # ---------------------------------------------------
      - name: Update & install feeds
        run: |
          cd "$BUILD_ROOT/openwrt"

          OK=0
          for i in 1 2 3; do
            echo "===== feeds update 第 $i 次 ====="
            if ./scripts/feeds update -a; then OK=1; break; fi
            sleep 5
          done
          [ "$OK" -eq 1 ] || { echo "::error::feeds update 连续失败"; exit 1; }

          OK=0
          for i in 1 2 3; do
            echo "===== feeds install 第 $i 次 ====="
            if ./scripts/feeds install -a; then OK=1; break; fi
            sleep 5
          done
          [ "$OK" -eq 1 ] || { echo "::error::feeds install 连续失败"; exit 1; }

      # ---------------------------------------------------
      # 载入配置：源码基座 + 机型 diffconfig
      #   1) 先用源码自带的 defconfig/mt7986-ax6000.config 打底
      #      （源码没有时回退到仓库里的 configs/base/ 副本）
      #   2) 追加 configs/<机型>.config（只写差异）
      #   3) 机型选择行以矩阵为准，只保留一个设备
      #   autosamba 在 configs/<机型>.config 里保持关闭，defconfig 后校验
      # ---------------------------------------------------
      - name: Load device configuration
        run: |
          S="$GITHUB_WORKSPACE/scripts/prepare-config.sh"
          [ -f "$S" ] || { echo "::error::缺少 $S"; exit 1; }
          dos2unix "$S" 2>/dev/null || true
          bash "$S" "$DEVICE" "$BUILD_ROOT/openwrt"

      # ---------------------------------------------------
      # diy-part2：配置载入后的钩子（默认留空，保持源码默认值）
      # ---------------------------------------------------
      - name: Run diy-part2.sh
        run: |
          cd "$BUILD_ROOT/openwrt"
          P2="$GITHUB_WORKSPACE/diy-part2.sh"
          if [ -f "$P2" ]; then
            echo "执行: ${P2}"
            dos2unix "$P2" 2>/dev/null || true
            bash "$P2"
          else
            echo "::warning::未找到 diy-part2.sh，跳过"
          fi

      # ---------------------------------------------------
      # diy-part3：统一追加手动勾选的源码内插件
      #   插件清单集中维护在仓库根目录的 diy-part3.sh。
      # ---------------------------------------------------
      - name: Run diy-part3.sh
        run: |
          cd "$BUILD_ROOT/openwrt"
          P3="$GITHUB_WORKSPACE/diy-part3.sh"
          [ -f "$P3" ] || { echo "::error::未找到 $P3"; exit 1; }
          dos2unix "$P3" 2>/dev/null || true
          bash "$P3"

      # ---------------------------------------------------
      # 可选 files 覆盖层
      # ---------------------------------------------------
      - name: Apply custom files
        run: |
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            echo "应用 files/ 覆盖层"
            mkdir -p "$BUILD_ROOT/openwrt/files"
            cp -a "$GITHUB_WORKSPACE/files/." "$BUILD_ROOT/openwrt/files/"
          else
            echo "无 files/，跳过"
          fi

      # ---------------------------------------------------
      # defconfig + 校验
      #   只跑这一次 defconfig，后续不再展开 .config，
      #   避免刚写进去的 autosamba / 机型选择被重新计算掉。
      # ---------------------------------------------------
      - name: make defconfig & validate
        id: validate
        run: |
          cd "$BUILD_ROOT/openwrt"

          if ! make defconfig > /tmp/defconfig.log 2>&1; then
            echo "::error::make defconfig 失败"
            tail -60 /tmp/defconfig.log
            exit 1
          fi
          tail -5 /tmp/defconfig.log
          grep -E '^(WARNING|ERROR)' /tmp/defconfig.log | head -20 || true

          # --- 机型校验 ---
          if ! grep -qx "CONFIG_TARGET_PROFILE=\"DEVICE_${PROFILE}\"" .config; then
            echo "::error::defconfig 后 TARGET_PROFILE 不是 ${PROFILE}"
            grep '^CONFIG_TARGET_PROFILE=' .config || true
            exit 1
          fi
          if ! grep -qx "CONFIG_TARGET_mediatek_filogic_DEVICE_${PROFILE}=y" .config; then
            echo "::error::defconfig 后机型 ${PROFILE} 未选中"
            exit 1
          fi
          COUNT=$(grep -c '^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y$' .config || true)
          if [ "${COUNT}" -ne 1 ]; then
            echo "::error::.config 中选中了 ${COUNT} 个机型，期望 1 个"
            exit 1
          fi

          # --- autosamba 校验 ---
          # 现有两台机型都没有 USB，autosamba 必须保持关闭
          if grep -qx 'CONFIG_PACKAGE_autosamba=y' .config; then
            echo "::error::${DEVICE} 没有 USB，不应启用 autosamba"
            exit 1
          fi
          echo "✅ autosamba 已关闭"

          # --- 机型 diffconfig 里的包被静默剔除时给出警告 ---
          # 典型：configs/<机型>.config 里选了源码 feeds 中不存在的包。
          grep -E '^CONFIG_PACKAGE_[^=]+=y$' "$GITHUB_WORKSPACE/${CONFIG_FILE}" \
            | sort -u > /tmp/want.pkgs || true
          grep -E '^CONFIG_PACKAGE_[^=]+=y$' .config \
            | sort -u > /tmp/got.pkgs || true
          comm -23 /tmp/want.pkgs /tmp/got.pkgs > /tmp/missing.pkgs || true
          if [ -s /tmp/missing.pkgs ]; then
            echo "::warning::以下机型配置里的包在 defconfig 后被剔除（源码/feeds 中不存在或依赖不满足）:"
            head -50 /tmp/missing.pkgs
          else
            echo "✅ 机型配置里的软件包全部保留"
          fi

          # --- diy-part3 插件校验 ---
          if [ -f .diy-part3-packages ]; then
            while IFS= read -r pkg; do
              [ -n "$pkg" ] || continue
              if ! grep -qx "CONFIG_PACKAGE_${pkg}=y" .config; then
                echo "::error::插件 ${pkg} 在 make defconfig 后未启用，请检查包是否存在或依赖是否满足"
                exit 1
              fi
            done < .diy-part3-packages
            echo "✅ diy-part3 插件均通过 defconfig 校验"
          fi

          echo "TARGET_BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)"
          echo "TARGET_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)"
          echo "PROFILE=$(grep '^CONFIG_TARGET_PROFILE=' .config | cut -d'"' -f2)"

      # ---------------------------------------------------
      # 可选：SSH 调试
      # ---------------------------------------------------
      - name: SSH connection to Actions
        if: github.event.inputs.ssh == 'true' && github.actor == github.repository_owner
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60

      # ---------------------------------------------------
      # 下载源码包（失败重试；下载不全拖到编译阶段报错更难查）
      # ---------------------------------------------------
      - name: Download package sources
        id: download
        run: |
          cd "$BUILD_ROOT/openwrt"
          OK=0
          for i in 1 2 3; do
            echo "===== make download 第 $i 次 ====="
            if make download -j"$(nproc)"; then OK=1; break; fi
            sleep 5
          done

          # 清掉下载失败留下的小文件，避免解压时报 not a tar archive
          find dl -size -1024c -type f -print -delete 2>/dev/null || true

          if [ "$OK" -ne 1 ]; then
            echo "::error::make download 连续 3 次失败，先修下载再编译"
            exit 1
          fi
          echo "dl 文件数: $(find dl -type f | wc -l)"

      # 下载成功就先存缓存：编译即使失败/超时，dl 也不白下
      - name: Save dl cache
        if: steps.dl.outputs.cache-hit != 'true' && steps.download.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.BUILD_ROOT }}/openwrt/dl
          key: mt798x-dl-${{ env.REPO_BRANCH }}-${{ steps.meta.outputs.week }}

      # ---------------------------------------------------
      # 编译
      # ---------------------------------------------------
      - name: Compile firmware
        id: compile
        run: |
          cd "$BUILD_ROOT/openwrt"
          JOBS=$(nproc)
          echo "开始编译 ${DEVICE}（${JOBS} 线程）"
          df -hT /

          if make -j"${JOBS}"; then
            echo "多线程编译成功"
          elif make -j1; then
            echo "单线程编译成功"
          elif make -j1 V=s; then
            echo "单线程 V=s 编译成功"
          else
            echo "::error::编译失败"
            exit 1
          fi

          df -hT /
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      # ---------------------------------------------------
      # 整理固件目录
      # ---------------------------------------------------
      - name: Organize firmware
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "$BUILD_ROOT"/openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=${PWD}" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"
          ls -lh

      - name: Upload firmware artifact
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_${{ matrix.device }}_${{ env.DATE }}
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------
      # Release：每个机型一个固定 tag
      #   同一机型重复编译会更新同一个 Release 并覆盖同名资产，
      #   不会越积越多。
      # ---------------------------------------------------
      - name: Generate release notes
        id: release
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        run: |
          if [ -z "${FIRMWARE}" ] || [ -z "$(ls -A "${FIRMWARE}" 2>/dev/null)" ]; then
            echo "::warning::固件目录为空，跳过 Release"
            exit 0
          fi

          {
            echo "## ImmortalWrt MT798X 自动编译"
            echo ""
            echo "| 项目 | 详情 |"
            echo "|------|------|"
            echo "| 机型 | \`${DEVICE}\` (\`${PROFILE}\`) |"
            echo "| 源码 | ${REPO_URL} |"
            echo "| 分支 | \`${REPO_BRANCH}\` |"
            echo "| 提交 | \`$(cd "$BUILD_ROOT/openwrt" && git rev-parse --short HEAD)\` |"
            echo "| 配置 | \`${CONFIG_FILE}\` |"
            echo "| 编译时间 | $(date '+%Y-%m-%d %H:%M:%S') (Asia/Shanghai) |"
            echo ""
            echo "### 文件校验"
            echo '```'
            (cd "${FIRMWARE}" && sha256sum -- * 2>/dev/null | grep -vE 'packages')
            echo '```'
            echo ""
            echo "---"
            echo "> 本 Release 为滚动页，同一机型重复编译会覆盖旧产物。"
          } > release.txt

          sha256sum release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ matrix.device }}
          name: ${{ matrix.device }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: false
          make_latest: false

      - name: Check disk usage
        if: always()
        run: df -hT
